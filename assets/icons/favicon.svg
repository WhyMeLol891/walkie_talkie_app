<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Antenna -->
  <rect x="140" y="24" width="28" height="150" rx="10" fill="#475569"/>
  <circle cx="154" cy="24" r="18" fill="#64748b"/>

  <!-- Dial Knobs -->
  <rect x="320" y="80" width="40" height="50" rx="8" fill="#334155"/>
  <rect x="380" y="94" width="30" height="36" rx="6" fill="#334155"/>

  <!-- Radio Chassis Body -->
  <rect x="100" y="130" width="312" height="350" rx="42" fill="url(#grad-body)" stroke="#334155" stroke-width="8"/>

  <!-- LCD Screen -->
  <rect x="136" y="164" width="240" height="96" rx="16" fill="#061814" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
  <text x="156" y="206" fill="#00ff88" font-family="monospace" font-size="24" font-weight="bold">CH: #GENERAL</text>
  <text x="156" y="238" fill="#4efcd2" font-family="monospace" font-size="16">144.250 MHz [TX/RX]</text>

  <!-- Speaker Grill Lines -->
  <g stroke="#1e293b" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="284" x2="352" y2="284"/>
    <line x1="180" y1="304" x2="332" y2="304"/>
    <line x1="160" y1="324" x2="352" y2="324"/>
    <line x1="180" y1="344" x2="332" y2="344"/>
  </g>

  <!-- Center PTT Circular Button Indicator -->
  <circle cx="256" cy="406" r="46" fill="url(#grad-accent)" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="406" r="34" fill="#0284c7"/>
  
  <!-- Microphone Icon on Button -->
  <path d="M256,386 C250.5,386 246,390.5 246,396 L246,408 C246,413.5 250.5,418 256,418 C261.5,418 266,413.5 266,408 L266,396 C266,390.5 261.5,386 256,386 Z M240,404 C240,412.8 247.2,420 256,420 C264.8,420 272,412.8 272,404 L276,404 C276,414.3 268.2,422.8 258.5,423.8 L258.5,428 L253.5,428 L253.5,423.8 C243.8,422.8 236,414.3 236,404 L240,404 Z" fill="#ffffff"/>
</svg>
